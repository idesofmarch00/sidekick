services:
  backend:
    build:
      context: ./sidekick-backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      # Mounts the backend folder so database changes persist locally on your Mac
      - ./sidekick-backend:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - NODE_ENV=development
